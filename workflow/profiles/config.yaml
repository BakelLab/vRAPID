########################## 
# Define basic settings #
#########################

executor:           lsf
scheduler:          greedy
jobs:               500
latency-wait:       5
rerun-incomplete:   false
use-singularity:    true
use-conda:          true
retries:            1

#############################
# Define default resources #
############################

default-resources:
  lsf_queue:    "private"
  lsf_project:  "acc_PVI"
  mem_mb:       120000
  runtime:      "12h"
  threads:      4
  span:         "span[hosts=1]"
  lsf_extra:    "-oo clusterlogs/%J.OU"
  lsf_tmp: "/sc/arion/scratch/khaliz03"

###################################
# Define rule-specific resources #
##################################

set-resources:
  run_kraken:
    mem_mb: 1000000
