########################## 
# Define basic settings #
#########################

executor:           lsf
scheduler:          greedy
jobs:               500
latency-wait:       5
rerun-incomplete:   false
use-singularity:    true
use-conda:          true
retries:            1

#############################
# Define default resources #
############################

default-resources:
  lsf_queue:    "express"
  lsf_project:  "acc_PVI"
  mem_mb:       95000
  runtime:      "12h"
  threads:      4
  span:         "span[hosts=1]"
  lsf_extra:    "-oo clusterlogs/%J.OU"
